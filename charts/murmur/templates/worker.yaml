apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "murmur.fullname" . }}-worker
  labels:
    {{- include "murmur.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  schedule: {{ .Values.worker.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.worker.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "murmur.selector" . | nindent 12 }}
            app.kubernetes.io/component: worker
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: worker
              image: {{ include "murmur.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["worker"]
              securityContext: {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "murmur.commonEnv" . | nindent 16 }}
                - name: LLM_BASE_URL
                  value: {{ .Values.worker.llmBaseURL | quote }}
                - name: LLM_MODEL
                  value: {{ .Values.worker.model | quote }}
                {{- if .Values.worker.llmApiKey.existingSecret }}
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.worker.llmApiKey.existingSecret }}
                      key: {{ .Values.worker.llmApiKey.key }}
                      # runs without pending work never need it
                      optional: true
                {{- end }}
                - name: OUTPUT_LANGUAGE
                  value: {{ .Values.worker.outputLanguage | quote }}
                - name: EXTRA_PROMPT
                  value: {{ .Values.worker.extraPrompt | quote }}
                - name: LLM_DISABLE_THINKING
                  value: {{ .Values.worker.disableThinking | quote }}
                - name: MAX_CHARS_PER_CALL
                  value: {{ .Values.worker.maxCharsPerCall | quote }}
                - name: MAX_TRANSCRIPTS_PER_RUN
                  value: {{ .Values.worker.maxTranscriptsPerRun | quote }}
              resources: {{- toYaml .Values.worker.resources | nindent 16 }}
          {{- with .Values.worker.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.tolerations }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
